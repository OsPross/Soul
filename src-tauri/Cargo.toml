[package]
name = "soul"
version = "0.2.0"
description = "Soul — cross-platform voice AI desktop assistant"
authors = ["you"]
edition = "2021"

[lib]
name = "soul_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3.5"
# rustls-tls (not native-tls) so HTTPS works consistently on Windows and Linux.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
base64 = "0.22"
enigo = "0.3"
arboard = "3"
thiserror = "2"
parking_lot = "0.12"
once_cell = "1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
window-vibrancy = "0.8.1"
# Live API: async WebSocket on Tauri's tokio runtime (rustls, no native-tls).
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
url = "2"
chrono-tz = "0.10"
# Local memory / scenes store (SQLite compiled in — no system library needed).
rusqlite = { version = "0.32", features = ["bundled"] }
# Offline wake word ("Soul"): pure-Rust MFCC + DTW spotter, trained locally from user samples.
rustpotter = "3.0.2"
# rustpotter's candle-core 0.2 needs half on rand_distr 0.4 (half >= 2.5 moved to 0.5). Direct
# pin so `cargo update` can't break the build.
half = "=2.4.1"

[target.'cfg(not(target_os = "linux"))'.dependencies]
# Screen capture (Windows). Linux uses x11rb directly (platform/x11_capture.rs): xcap always links
# PipeWire (libspa 0.10), which needs newer headers than Ubuntu 22.04 ships.
xcap = { version = "0.9", default-features = false }

[target.'cfg(windows)'.dependencies]
# Gemini API key in Windows Credential Manager (secrets.rs).
keyring = { version = "3.6", features = ["windows-native"] }
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Gemini API key in the Secret Service (GNOME Keyring / KWallet) — pure Rust over zbus (secrets.rs).
keyring = { version = "3.6", features = ["async-secret-service", "async-io", "crypto-rust"] }
# MPRIS (island/media.rs). async-io = zbus's own executor behind the blocking API; without a runtime
# feature zbus does not compile (it only built before because another crate enabled one).
zbus = { version = "4", default-features = false, features = ["async-io"] }
# XRecord: passive global key/button snooping for the Smart talk key on X11 (pure Rust).
x11rb = { version = "0.13", features = ["record", "randr"] }
# nice() for the low-priority wake word thread (already in the tree via cpal/alsa).
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
